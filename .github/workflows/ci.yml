# Runs on every push and pull request. A red cross here means: do not merge.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci          # install exactly what package-lock.json says
      - run: npm run typecheck
      - run: npm test         # no API key needed: every test fakes the model

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # the whole history, not only the latest commit
      # Scan every commit, every time. (The ready-made gitleaks action only
      # scans the commits in a push, and fails on a repo's very first push.)
      - name: Scan the whole history for secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --no-banner --redact
